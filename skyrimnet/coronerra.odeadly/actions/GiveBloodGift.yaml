# O'Deadly Skyrim 1.1: an NPC this mod turned gives the player their blood gift (no chance roll).
name: GiveBloodGift
description: >-
  Give {{ player.name }} your blood gift, so {{ player.name }} becomes what you are. Use it only
  when {{ player.name }} has clearly asked for it and you agree.

questEditorId: ODS_MainQuest
scriptName: ODS_Main
executionFunctionName: SNGiveBloodGift

# Function SNGiveBloodGift(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "none", "ODS_PathoOn", 0]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "none", "ODS_PlayerBlood", 0]
        comparisonOperator: "=="
        expectedValue: 0
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "ODS_BeastKind", 0]
        comparisonOperator: ">"
        expectedValue: 0
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} gave {{ player.name }} their blood gift."
defaultPriority: 3
