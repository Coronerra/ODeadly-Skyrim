# O'Deadly Skyrim 1.1 (Blood Born Pathogen): an NPC this mod turned changes into full beast form.
# Offered only to turned NPCs who are not already changed (StorageUtil values set by ODS_Main).
# 1.1.4: offered to followers with Growl's companion beastblood too (O'Deadly changes them on request).
# No timer: they stay changed until they choose TransformBack, or, if they changed during a fight,
# until that fight is over.
name: TransformToBeast
description: >-
  Change into your full beast form: a werewolf, a vampire lord or a werebear, whatever your blood
  made you. Use it when {{ player.name }} asks you to, or on your own when it truly fits: a fight
  or a threat, a hunt, a show of what you have become, or a moment of beast desire. Not in a
  normal, calm conversation unless asked.

questEditorId: ODS_MainQuest
scriptName: ODS_Main
executionFunctionName: SNTransformToBeast

# Function SNTransformToBeast(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "none", "ODS_FormsOn", 0]
        comparisonOperator: "=="
        expectedValue: 1
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "ODS_BeastKind", 0]
        comparisonOperator: ">"
        expectedValue: 0
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "ODS_BeastForm", 0]
        comparisonOperator: "=="
        expectedValue: 0
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} changed into full beast form."
defaultPriority: 4
